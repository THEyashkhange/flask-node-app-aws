<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task 1</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #responseMessage { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>User Submission Form</h2>
    
    <form id="userForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" required placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="Enter your email">
        </div>
        <button type="submit">Submit Data</button>
    </form>

    <div id="responseMessage"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userForm = document.getElementById('userForm');
            
            userForm.addEventListener('submit', async (e) => {
                e.preventDefault(); 

                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const messageElement = document.getElementById('responseMessage');

                try {
                    const response = await fetch('http://13.218.169', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ name, email })
                    });

                    const data = await response.json();
                    console.log("Server Response:", data);
                    
                    messageElement.innerText = data.message;
                    messageElement.style.color = data.status === 'success' ? 'green' : 'red';

                } catch (error) {
                    console.error('Error during submission:', error);
                    messageElement.innerText = 'Error connecting to the Flask backend server.';
                    messageElement.style.color = 'red';
                }
            });
        });
    </script>
</body>
</html>
