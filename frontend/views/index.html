
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            padding: 8px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #responseMessage {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h2>User Submission Form</h2>

    <form id="userForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" required
                   placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required
                   placeholder="Enter your email">
        </div>

        <button type="submit" id="submitButton">
            Submit Data
        </button>
    </form>

    <div id="responseMessage" role="status"></div>

    <script>
        const userForm = document.getElementById('userForm');
        const messageElement = document.getElementById('responseMessage');
        const submitButton = document.getElementById('submitButton');

        userForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();

            messageElement.textContent = 'Submitting...';
            messageElement.style.color = 'black';
            submitButton.disabled = true;

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email })
                });

                const data = await response.json();

                messageElement.textContent =
                    data.message || 'Request completed.';

                messageElement.style.color =
                    response.ok && data.status === 'success'
                        ? 'green'
                        : 'red';

            } catch (error) {
                console.error('Submission failed:', error);

                messageElement.textContent =
                    'Could not reach the application server. Check the Node.js logs.';

                messageElement.style.color = 'red';
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
